# Verificación de solo lectura: la publicación se hace explícitamente tras una PR.
name: Verificar GRIT CLAYMORE v1.14
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verificar-grit.yml'
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - 'assets/**'
      - 'build_all.py'
      - 'build_asm.py'
      - 'make_tap.py'
      - 'requirements.txt'
      - 'juego/**'
  pull_request:
    paths:
      - '.github/workflows/verificar-grit.yml'
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - 'assets/**'
      - 'build_all.py'
      - 'build_asm.py'
      - 'make_tap.py'
      - 'requirements.txt'
      - 'juego/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compilar-y-verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar fuentes
        uses: actions/checkout@v4
      - name: Instalar dependencias
        run: python3 -m pip install -r requirements.txt
      - name: Compilar v1.14 y ejecutar regresiones Z80 de publicación
        timeout-minutes: 15
        run: python3 -u build_all.py --ci
      - name: Verificar identidad exacta del TAP oficial v1.14
        run: |
          set -euo pipefail
          echo "3088339d7a9f822c072f0377abc9872db931b7daa4a6de8498b252c61b7727f3  juego/GRIT_CLAYMORE_V1.14_48K.tap" | sha256sum -c -
          echo "3088339d7a9f822c072f0377abc9872db931b7daa4a6de8498b252c61b7727f3  build/GRIT_CLAYMORE_V1.14_48K.tap" | sha256sum -c -
          cmp juego/GRIT_CLAYMORE_V1.14_48K.tap build/GRIT_CLAYMORE_V1.14_48K.tap

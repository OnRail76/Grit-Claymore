# CI de solo lectura. La publicación de Releases se realiza manualmente.
name: Verificar GRIT CLAYMORE V1.9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verificar-grit.yml'
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - 'assets/**'
      - 'build_all.py'
      - 'build_asm.py'
      - 'make_tap.py'
      - 'requirements.txt'
      - 'juego/**'
  pull_request:
    paths:
      - '.github/workflows/verificar-grit.yml'
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - 'assets/**'
      - 'build_all.py'
      - 'build_asm.py'
      - 'make_tap.py'
      - 'requirements.txt'
      - 'juego/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar-y-verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar fuentes
        uses: actions/checkout@v4
      - name: Instalar dependencias Python
        run: python3 -m pip install -r requirements.txt
      - name: Compilar TAP y ejecutar regresiones Z80
        run: python3 build_all.py
      - name: Verificar identidad exacta con V1.9 publicada
        run: |
          set -euo pipefail
          echo "1ddb25648cd64e9fb0b36c7af87c6def9e7620365aa1256920c27c2f6e823127  juego/GRIT_CLAYMORE_V1.9_48K.tap" | sha256sum -c -
          echo "1ddb25648cd64e9fb0b36c7af87c6def9e7620365aa1256920c27c2f6e823127  build/GRIT_CLAYMORE_V1.9_48K.tap" | sha256sum -c -

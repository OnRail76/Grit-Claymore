# CI de solo lectura. La publicación de Releases se realiza manualmente.
name: Verificar GRIT CLAYMORE V1.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verificar-grit.yml'
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - 'assets/**'
      - 'build_all.py'
      - 'build_asm.py'
      - 'make_tap.py'
      - 'requirements.txt'
      - 'juego/**'
  pull_request:
    paths:
      - '.github/workflows/verificar-grit.yml'
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - 'assets/**'
      - 'build_all.py'
      - 'build_asm.py'
      - 'make_tap.py'
      - 'requirements.txt'
      - 'juego/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar-y-verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar fuentes
        uses: actions/checkout@v4
      - name: Instalar dependencias Python
        run: python3 -m pip install -r requirements.txt
      - name: Compilar TAP y ejecutar regresiones Z80
        run: python3 build_all.py
      - name: Verificar identidad exacta con V1.6 publicada
        run: |
          set -euo pipefail
          echo "8ea29ae17ada3ca62983b48bbac6385f07a5df47c773a7376b5a74d4ee082a8d  juego/GRIT_CLAYMORE_V1.6_48K.tap" | sha256sum -c -
          echo "8ea29ae17ada3ca62983b48bbac6385f07a5df47c773a7376b5a74d4ee082a8d  build/GRIT_CLAYMORE_V1.6_48K.tap" | sha256sum -c -
